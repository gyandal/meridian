name: release

# Push a tag like v0.1.0 (or v0.1.0-preview.1) to build, test, pack and publish to nuget.org.
# Uses NuGet Trusted Publishing (OIDC) — no long-lived API key. One-time setup:
#   1. nuget.org → Account → Trusted Publishing → add a policy for this repo + workflow file "release.yml"
#      (+ environment "nuget").
#   2. GitHub repo → Settings → Environments → create "nuget" (optionally require approval).
#   3. Add repo secret NUGET_USER = your nuget.org username (the profile name, not your email).

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC token for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build -c Release -p:Version=$VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
