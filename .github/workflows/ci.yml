name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

      - name: Pack (smoke test)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release --no-build -o artifacts

      # The README's quick start, executed so the documented example can't rot.
      - name: Quick start sample
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run -c Release --no-build --project samples/Meridian.Sample.QuickStart

      # Keeps the scale harness working end to end. Tiny data; timings on shared runners are not comparable.
      - name: Scale benchmark (smoke)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet run -c Release --no-build --project bench/Meridian.Bench.Scale --
          all --entities 50 --metrics 1 --days 120 --per-day 4
          --data data/ci --label ci-smoke --out artifacts/bench --iterations 2 --warm-iterations 5

      - name: Upload benchmark results
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke
          path: artifacts/bench
